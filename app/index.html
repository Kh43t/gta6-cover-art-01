<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Coast Cover Studio — Make GTA 6 Cover Art</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">VC</span>
    <div>
      <h1>Vice Coast Cover Studio</h1>
      <p>Make GTA 6 cover art — offline, on canvas, photos stay on your machine.</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="undoBtn" type="button" title="Undo (Ctrl+Z)">↩ Undo</button>
    <button id="redoBtn" type="button" title="Redo (Ctrl+Y)">↪ Redo</button>
    <button id="exportAll" type="button" class="primary">Export all three</button>
  </div>
</header>

<main class="workspace">
  <section class="stage">
    <canvas id="coverCanvas" width="1080" height="1080" aria-label="Cover preview. Click a panel to select it, drag to move the photo, scroll to zoom."></canvas>
    <p class="hint">Click a panel to select it · drag to move the photo · scroll to zoom · arrow keys nudge · + / − zoom</p>
    <div class="export-row">
      <button id="exportSquare" type="button">Square · 1080 × 1080</button>
      <button id="exportPortrait" type="button">Portrait · 1080 × 1350</button>
      <button id="exportWide" type="button">Wide · 1920 × 1080</button>
    </div>
  </section>

  <aside class="panel">
    <section class="group">
      <h2>Look</h2>
      <label>Layout
        <select id="layoutSelect"></select>
      </label>
      <label>Colour grade
        <select id="gradeSelect"></select>
      </label>
      <label>Lettering
        <select id="letteringSelect"></select>
      </label>
    </section>

    <section class="group">
      <h2>Words</h2>
      <label>Title (max 30)
        <input id="titleInput" type="text" maxlength="30" value="VICE COAST">
      </label>
      <label>Subtitle
        <input id="subtitleInput" type="text" value="SUNSET BOULEVARD • EST. 1986">
      </label>
      <label>Badge ribbon
        <input id="ribbonInput" type="text" value="VICE CITY">
      </label>
      <label>Heat stars — <span id="starsValue">4 / 5</span>
        <input id="starsInput" type="range" min="0" max="5" step="1" value="4">
      </label>
    </section>

    <section class="group">
      <h2>Crop <span id="panelLabel" class="panel-label"></span></h2>
      <label>Zoom — <span id="zoomValue">1.00×</span>
        <input id="zoomRange" type="range" min="1" max="4" step="0.01" value="1">
      </label>
      <label>Move left / right — <span id="oxValue">0.00</span>
        <input id="oxRange" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label>Move up / down — <span id="oyValue">0.00</span>
        <input id="oyRange" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
    </section>

    <section class="group">
      <h2>Photos</h2>
      <div id="sampleStrip" class="samples"></div>
      <button id="addPhotoBtn" type="button">Add your own photo…</button>
      <input id="addPhotoInput" type="file" accept="image/*" hidden>
      <p class="fineprint">Your photo is loaded as an object URL and never leaves this page.</p>
    </section>
  </aside>
</main>

<script type="module" src="src/studio.js"></script>
</body>
</html>
